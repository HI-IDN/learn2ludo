<!-- ADMIN -->
  <div class="panel" id="panel-admin">
    <div style="margin-bottom:24px; display:flex; align-items:center; gap:12px;">
      <h1 style="font-size:22px; font-weight:700;">Admin</h1>
      <span class="badge badge-purple" id="admin-auth-badge">locked</span>
    </div>
    <div id="admin-locked-msg" class="card" style="background:var(--bg2); max-width:400px;">
      <p style="font-size:14px; font-weight:600; margin-bottom:4px;">Admin access required</p>
      <p style="font-size:13px; color:var(--text2); margin-bottom:16px;">Enter your admin password to manage tabs and system settings. First-run: any password will be set as the admin password.</p>
      <div class="alert" id="admin-alert"></div>
      <div style="display:flex; gap:8px;">
        <input type="password" id="admin-pw" placeholder="Password…" style="flex:1;" onkeydown="if(event.key==='Enter')doAdminLogin()">
        <button class="btn btn-primary" onclick="doAdminLogin()">Unlock</button>
      </div>
    </div>
    <div id="admin-panel" style="display:none;">
      <div class="alert alert-success" id="admin-save-ok">Settings saved.</div>
      <p class="section-title">Tab visibility &amp; defaults</p>
      <p style="font-size:13px; color:var(--text2); margin-bottom:16px;">Control which tabs are available and whether they are visible by default for new users.</p>
      <div id="tab-config-list"></div>
      <div style="display:flex; gap:8px; margin-top:20px;">
        <button class="btn btn-primary" onclick="saveTabConfig()"><i class="ti ti-device-floppy"></i> Save changes</button>
      </div>
    </div>
  </div>
