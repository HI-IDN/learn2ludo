<!-- REPLAYS -->
<div class="panel" id="panel-replays">
  <div style="margin-bottom:20px; display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap;">
    <div>
      <h1 style="font-size:22px; font-weight:700;">Replays</h1>
      <p style="font-size:13px; color:var(--text2); margin-top:4px;">Browse and load saved games.</p>
    </div>
    <div id="replays-admin-widget"></div>
  </div>

  <!-- Replay viewer -->
  <div class="replays-viewer" id="replays-viewer" hidden style="grid-template-columns:1fr; background:#fff; border:1px solid var(--border-light,#E2E5EE); border-radius:16px; padding:14px; margin-bottom:20px;">
    <div class="replays-viewer-head" style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:12px;">
      <div>
        <div class="replays-viewer-kicker">Selected replay</div>
        <div class="replays-viewer-title" id="replays-viewer-title">Replay</div>
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        <button class="btn btn-sm" onclick="showReplayStatsFromPage()" title="Show replay stats">
          <i class="ti ti-chart-bar"></i> Stats
        </button>
        <button class="btn btn-sm" onclick="quitReplayFromPage()" title="Close replay">
          <i class="ti ti-x"></i> Quit replay
        </button>
      </div>
    </div>
    <div class="replays-play-host" id="replays-play-host" style="width:100%;"></div>
  </div>

  <!-- Game list -->
  <div class="replays-count" id="replays-count"></div>
  <div class="replay-picker-list replays-page-list" id="replays-list">
    <p class="replay-picker-empty">Loading…</p>
  </div>
</div>
