<!-- REPLAYS -->
<div class="panel" id="panel-replays">
  <div style="margin-bottom:20px; display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap;">
    <div>
      <h1 style="font-size:22px; font-weight:700;">Replays</h1>
      <p style="font-size:13px; color:var(--text2); margin-top:4px;">Browse and load saved games.</p>
    </div>
    <div id="replays-admin-widget"></div>
  </div>

  <!-- Filters -->
  <div class="replays-filters">
    <input class="replays-search" id="replays-search" type="search" placeholder="Search by name…" oninput="filterReplays()">

    <div class="replays-filter-group">
      <span class="replays-filter-label">Player count</span>
      <div class="replays-pills" id="replays-filter-players"></div>
    </div>

    <div class="replays-filter-group">
      <span class="replays-filter-label">Yards</span>
      <div class="replays-pills" id="replays-filter-yards"></div>
    </div>

    <div class="replays-filter-group" id="replays-filter-person-group">
      <span class="replays-filter-label">Person</span>
      <div class="replays-pills" id="replays-filter-person"></div>
    </div>

    <div class="replays-filter-group" id="replays-filter-result-group" style="display:none;">
      <span class="replays-filter-label">Result</span>
      <div class="replays-pills" id="replays-filter-result">
        <button class="replays-pill active" data-val="all"  onclick="setResultFilter('all', this)">All</button>
        <button class="replays-pill"         data-val="won"  onclick="setResultFilter('won', this)">Won</button>
        <button class="replays-pill"         data-val="lost" onclick="setResultFilter('lost', this)">Lost</button>
      </div>
    </div>
  </div>

  <!-- Replay viewer -->
  <div class="replays-viewer" id="replays-viewer" hidden>
    <div class="replays-viewer-head">
      <div>
        <div class="replays-viewer-kicker">Selected replay</div>
        <div class="replays-viewer-title" id="replays-viewer-title">Replay</div>
      </div>
      <div class="replays-viewer-controls" id="replays-controls-host"></div>
    </div>
    <div class="replays-board-host" id="replays-board-host"></div>
  </div>

  <!-- Game list -->
  <div class="replays-ready-strip" id="replays-ready-strip"></div>
  <div class="replays-count" id="replays-count"></div>
  <div class="replays-list" id="replays-list">
    <p class="replays-empty">Loading…</p>
  </div>
</div>
