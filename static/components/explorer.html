<section id="panel-explorer" class="panel">
  <div class="card explorer-card">
    <div class="explorer-header">
      <div>
        <h2 class="explorer-title">Ludo History & Variants Explorer</h2>
        <p class="explorer-subtitle">Explore where variants emerged and how they evolved from ~500 AD to today.</p>
      </div>
      <button class="btn btn-sm" id="explorer-play-variant-btn" type="button" disabled>
        Play this variant
      </button>
    </div>
    <div class="explorer-grid">
      <div class="explorer-map-column">
        <h3>Variant Origins Map</h3>
        <div id="history-map"></div>
      </div>
      <div class="explorer-timeline-column">
        <h3>Timeline</h3>
        <div id="history-timeline"></div>
      </div>
      <div class="explorer-detail-column">
        <h3>Variant Details</h3>
        <div id="history-variant-detail">
          <p>Select a map pin or timeline entry to view details.</p>
        </div>
      </div>
    </div>
  </div>
</section>
