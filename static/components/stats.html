<!-- STATS -->
  <div class="panel" id="panel-stats">
    <div style="margin-bottom:24px;">
      <h1 style="font-size:22px; font-weight:700;">Stats & Replay</h1>
      <p style="font-size:13px; color:var(--text2); margin-top:4px;">Win rates, training history, game replays</p>
    </div>
    <div class="stats-row" id="stats-overview">
      <div class="stat-card"><div class="stat-label">Games played</div><div class="stat-value" id="st-games">0</div></div>
      <div class="stat-card"><div class="stat-label">Training sessions</div><div class="stat-value" id="st-sessions">0</div></div>
      <div class="stat-card"><div class="stat-label">Best win rate</div><div class="stat-value" id="st-winrate">—</div></div>
    </div>
    <div style="margin-top:8px;">
      <p class="section-title">Training history</p>
      <div id="history-list" style="display:flex; flex-direction:column; gap:8px;"></div>
      <p id="no-history" style="font-size:13px; color:var(--text3); padding:24px 0;">No training sessions yet. Run a training session from the Train tab.</p>
    </div>
  </div>
