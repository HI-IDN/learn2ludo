<!-- PLAY -->
<div class="panel" id="panel-play">

  <!-- MAIN LAYOUT -->
  <div id="play-layout">

    <!-- LEFT: BOARD -->
    <div id="board-area">
      <div id="board-wrap">
        <svg id="ludo-board" class="board-svg" viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg">
          <!-- drawn by JS -->
        </svg>
      </div>
    </div>

    <!-- RIGHT: SIDE PANEL -->
    <div id="side-panel">

      <!-- TOP CONTROLS -->
      <div class="side-section controls">
        <div class="replay-controls-row replay-controls-row--top" id="live-speed-controls">
          <span class="replay-status">Controls</span>
          <button class="btn btn-sm replay-step-btn"
                  id="live-back-btn"
                  onclick="liveTimelineStep(-1)"
                  title="Previous move">
            <i class="fa-solid fa-step-backward"></i>
          </button>
          <button class="btn btn-sm replay-step-btn"
                  id="speed-pause-btn"
                  onclick="setAutoPlaySpeed('off')"
                  title="Pause (manual dice and moves)">
            <i class="fa-solid fa-pause"></i>
          </button>
          <button class="btn btn-sm replay-step-btn"
                  id="speed-normal-btn"
                  onclick="setAutoPlaySpeed('normal')"
                  title="Fast (with animation and sound)">
            <i class="fa-solid fa-play"></i>
          </button>
          <button class="btn btn-sm replay-step-btn"
                  id="speed-fast-btn"
                  onclick="setAutoPlaySpeed('fast')"
                  title="Fast forward (no animation, no sound)">
            <i class="fa-solid fa-forward"></i>
          </button>
          <button class="btn btn-sm replay-step-btn"
                  id="live-forward-btn"
                  onclick="liveTimelineStep(1)"
                  title="Next move">
            <i class="fa-solid fa-step-forward"></i>
          </button>
          <span class="replay-status" id="live-timeline-status"></span>
        </div>

        <div class="replay-controls-row replay-controls-row--top" id="replay-step-controls" style="display:none">
          <span class="replay-status">Controls</span>
          <button class="btn btn-sm replay-step-btn"
                  id="replay-prev-btn"
                  onclick="transportPauseOrBack()"
                  disabled
                  title="Previous move">
            <i class="fa-solid fa-step-backward"></i>
          </button>
          <button class="btn btn-sm replay-step-btn"
                  id="replay-play-btn"
                  onclick="transportPlay()"
                  disabled
                  title="Play">
            <i class="fa-solid fa-play"></i>
          </button>
          <button class="btn btn-sm replay-step-btn"
                  id="replay-fast-btn"
                  onclick="transportFastForward()"
                  disabled
                  title="Fast forward">
            <i class="fa-solid fa-forward"></i>
          </button>
          <button class="btn btn-sm replay-step-btn"
                  id="replay-forward-btn"
                  onclick="replayStep(1)"
                  disabled
                  title="Next move">
            <i class="fa-solid fa-step-forward"></i>
          </button>
          <span class="replay-status" id="replay-status"></span>
        </div>

        <label class="sound-volume-control" title="Sound volume">
          <i class="fa-solid fa-volume-high" id="sound-volume-icon"></i>
          <input type="range"
                 id="sound-volume-slider"
                 min="0"
                 max="1"
                 step="0.05"
                 value="0.8"
                 oninput="setSoundVolume(this.value, true)"
                 onchange="setSoundVolume(this.value, true)">
        </label>
      </div>

      <!-- PLAYERS -->
      <div class="side-section">
        <div class="player-order-title">Players <span id="players-subtitle" class="players-subtitle"></span></div>
        <div id="players-list"></div>
      </div>

      <!-- CURRENT ACTION -->
      <div class="side-section">
        <div class="player-order-title" id="current-action-title">Current action</div>

        <div class="action-card" id="action-card">
          <div class="action-card-top idle" id="action-card-top">
            <div class="action-card-avatar">
              <span class="action-avatar-content" id="action-avatar-content">
                <i class="action-avatar-icon fa-solid fa-circle-info"></i>
              </span>
              <img id="action-avatar-laurel" class="action-avatar-laurel" src="/static/icons/laurel.svg" alt="" hidden>
            </div>
            <div class="action-card-name" id="turn-player-name">No game</div>
          </div>

          <div class="action-card-body">
            <div class="dice-face" id="dice-face" onclick="_onDiceClick()">&#9856;</div>

            <div id="pregame-container" style="display:none"></div>

            <div id="game-action-wrap">
              <div class="action-instruction" id="action-instruction">
                Set up players before playing.
              </div>
              <div id="move-justification-wrap" class="move-justification-wrap" hidden></div>
            </div>
          </div>
        </div>
      </div>

      <!-- MOVE FEATURES -->
      <div class="side-section collapsible-section collapsed" id="section-pawn-features" style="display:none;">
        <button class="collapsible-header" onclick="toggleSection('section-pawn-features')">
          <span class="player-order-title">Move features</span>
          <i class="fa-solid fa-chevron-down collapsible-chevron"></i>
        </button>
        <div class="collapsible-body">
          <div class="pawn-options-card" id="pawn-options-card">
            <div class="move-history-empty">No game set up yet.</div>
          </div>
        </div>
      </div>

      <!-- MOVE HISTORY -->
      <div class="side-section collapsible-section grow" id="section-move-history">
        <button class="collapsible-header" onclick="toggleSection('section-move-history')">
          <span class="player-order-title">History</span>
          <i class="fa-solid fa-chevron-down collapsible-chevron"></i>
        </button>
        <div class="collapsible-body">
          <div class="move-history-card">
            <div id="move-history-list" class="move-history-list">
              <div class="move-history-empty">No game set up yet.</div>
            </div>
          </div>
        </div>
      </div>

      <!-- SAVE / REPLAY -->
      <div class="side-footer">
        <div class="replay-controls">
          <div class="replay-controls-row">
            <div id="new-game-control">
              <button class="btn btn-primary btn-sm" onclick="requestNewGame()">
                <i class="ti ti-users"></i> Player Setup
              </button>
            </div>
            <button class="btn btn-sm"
                    id="save-game-json-btn"
                    onclick="saveGameJson()"
                    disabled
                    title="Save game JSON">
              <i class="fa-solid fa-download"></i> Save JSON
            </button>
            <div id="load-replay-control">
              <input type="file"
                     id="replay-json-input"
                     accept="application/json,.json"
                     onchange="loadReplayJsonFile(this.files?.[0])"
                     hidden>
              <button class="btn btn-sm"
                      id="load-replay-json-btn"
                      onclick="requestLoadReplayJson()"
                      title="Load replay JSON">
                <i class="fa-solid fa-folder-open"></i> Replay
              </button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
