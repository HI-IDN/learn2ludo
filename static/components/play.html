<!-- PLAY -->
<div class="panel" id="panel-play">

  <!-- MAIN LAYOUT -->
  <div id="play-layout">

    <!-- LEFT: BOARD -->
    <div id="board-area">
      <div id="board-wrap">
        <svg id="ludo-board" class="board-svg" viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg">
          <!-- drawn by JS -->
        </svg>
      </div>
    </div>

    <!-- RIGHT: SIDE PANEL -->
    <div id="side-panel">

      <!-- TOP CONTROLS -->
      <div class="side-section controls">
        <div id="new-game-control">
          <button class="btn btn-primary" onclick="requestNewGame()">
            <i class="ti ti-plus"></i> New game
          </button>
        </div>

        <label class="sound-volume-control" title="Sound volume">
          <i class="fa-solid fa-volume-high" id="sound-volume-icon"></i>
          <input type="range"
                 id="sound-volume-slider"
                 min="0"
                 max="1"
                 step="0.05"
                 value="0.8"
                 oninput="setSoundVolume(this.value, true)"
                 onchange="setSoundVolume(this.value, true)">
        </label>
      </div>

      <!-- PLAYERS -->
      <div class="side-section">
        <div class="player-order-title">Players <span id="players-subtitle" class="players-subtitle"></span></div>
        <div id="players-list"></div>
      </div>

      <!-- CURRENT ACTION -->
      <div class="side-section">
        <div class="player-order-title">Current action</div>

        <div class="dice-display" id="dice-display">
          <div id="pregame-container" style="display:none"></div>

          <div id="game-action-wrap">
            <div class="turn-banner idle" id="turn-banner">
              <i class="fa-solid fa-circle-info"></i>
              <span id="turn-player-name">Start game</span>
            </div>

            <div class="action-instruction" id="action-instruction">
              Click <strong>New game</strong> to begin.
            </div>

            <div class="dice-face" id="dice-face">⚀</div>

            <div style="margin-top:12px; display:flex; justify-content:center;">
              <button class="btn btn-primary btn-sm"
                      id="roll-btn"
                      onclick="rollDice()"
                      disabled>
                <i class="fa-solid fa-dice-d6"></i> Roll
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- PAWN FEATURES -->
      <div class="side-section">
        <div class="player-order-title">Pawn features</div>
        <div class="pawn-options-card" id="pawn-options-card">
          <div class="move-history-empty">Start a game to inspect pawn options.</div>
        </div>
      </div>

      <!-- MOVE HISTORY -->
      <div class="side-section grow">
        <div class="player-order-title">Move history</div>
        <div class="move-history-card">
          <div id="move-history-list" class="move-history-list">
            <div class="move-history-empty">No committed moves yet.</div>
          </div>
        </div>
      </div>

      <!-- SAVE BUTTON (BOTTOM STICKY) -->
      <div class="side-footer">
        <button class="btn btn-sm"
                id="save-game-json-btn"
                onclick="saveGameJson()"
                disabled>
          <i class="fa-solid fa-download"></i> Save JSON
        </button>
      </div>

    </div>
  </div>
</div>
